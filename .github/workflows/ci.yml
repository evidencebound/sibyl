name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip
      - run: python -m pip install -e . pytest
      - run: python -c "import importlib.metadata as m; assert m.version('sibyl-memory-client') == '0.8.0'"
      - run: pytest -q
      - run: python scripts/judge_acceptance.py --db /tmp/judge.db
      - run: python scripts/deletion_acceptance.py
