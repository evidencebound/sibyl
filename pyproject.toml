[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencebound-memory-authority-plane"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["sibyl-memory-client==0.8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
